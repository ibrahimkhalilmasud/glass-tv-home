plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mytvhome.settings'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mytvhome.settings'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB, never published: signed with the same debug key as the other apps.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
