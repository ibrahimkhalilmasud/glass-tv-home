<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Send a photo to the TV</title>
<style>
  :root { --ink: #f5f3ee; --soft: rgba(245,243,238,0.7); --edge: rgba(255,255,255,0.18); --accent: #f3e6c8; --bad: #ffb4a8; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 28px 18px 40px; color: var(--ink);
    font-family: system-ui, -apple-system, "Roboto", sans-serif;
    background: radial-gradient(120% 80% at 20% 0%, #23384f 0%, #0b1018 60%, #06080c 100%);
  }
  main { max-width: 520px; margin: 0 auto; }
  h1 { font-weight: 300; font-size: 30px; margin: 4px 0 6px; }
  p { color: var(--soft); line-height: 1.5; margin: 0 0 18px; }
  .card { background: rgba(255,255,255,0.06); border: 1px solid var(--edge); border-radius: 22px; padding: 20px; margin-top: 18px; }
  label { display: block; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--soft); margin-bottom: 10px; }
  input[type=text] {
    width: 100%; font-size: 30px; letter-spacing: 0.3em; text-align: center; color: var(--ink); padding: 14px;
    background: rgba(0,0,0,0.25); border: 1px solid var(--edge); border-radius: 14px;
  }
  .pick { display: block; text-align: center; padding: 18px; border: 1.5px dashed var(--edge); border-radius: 16px; color: var(--accent); font-size: 18px; }
  input[type=file] { display: none; }
  .preview { width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; background: #000 center / cover no-repeat; margin-top: 14px; display: none; }
  button {
    width: 100%; margin-top: 20px; font-size: 19px; padding: 16px; border-radius: 999px; border: 0;
    background: var(--accent); color: #141414; font-weight: 600;
  }
  button:disabled { opacity: 0.45; }
  .status { margin-top: 16px; min-height: 24px; text-align: center; }
  .status.bad { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Send a photo to the TV</h1>
  <p>It will fill the whole TV screen (cropped to 16:9). Then choose it on the TV under Home settings &rsaquo; Wallpaper.</p>

  <div class="card">
    <label for="code">Code shown on the TV</label>
    <input id="code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
  </div>

  <div class="card">
    <label>Photo</label>
    <label class="pick" for="file">Choose a photo</label>
    <input id="file" type="file" accept="image/*">
    <div class="preview" id="preview"></div>
  </div>

  <button id="send" disabled>Send to TV</button>
  <div class="status" id="status"></div>
</main>
<script>
(function () {
  'use strict';
  var WIDTH = 1920, HEIGHT = 1080, QUALITY = 0.9;
  var file = document.getElementById('file'), code = document.getElementById('code');
  var send = document.getElementById('send'), status = document.getElementById('status');
  var preview = document.getElementById('preview');
  var jpeg = null;

  function say(msg, bad) { status.textContent = msg; status.className = 'status' + (bad ? ' bad' : ''); }
  function ready() { send.disabled = !(jpeg && /^\d{6}$/.test(code.value.trim())); }

  // Centre-crop to 16:9 and scale to 1920x1080 on the phone, so only a modest JPEG crosses the network.
  function prepare(f) {
    return createImageBitmap(f, { imageOrientation: 'from-image' }).then(function (img) {
      var target = WIDTH / HEIGHT, sw = img.width, sh = img.height;
      if (sw / sh > target) sw = Math.round(sh * target); else sh = Math.round(sw / target);
      var sx = Math.round((img.width - sw) / 2), sy = Math.round((img.height - sh) / 2);
      var c = document.createElement('canvas');
      c.width = WIDTH; c.height = HEIGHT;
      var g = c.getContext('2d');
      g.imageSmoothingQuality = 'high';
      g.drawImage(img, sx, sy, sw, sh, 0, 0, WIDTH, HEIGHT);
      return new Promise(function (resolve) { c.toBlob(resolve, 'image/jpeg', QUALITY); });
    });
  }

  file.addEventListener('change', function () {
    var f = file.files && file.files[0];
    if (!f) return;
    say('Preparing…');
    prepare(f).then(function (blob) {
      jpeg = blob;
      preview.style.backgroundImage = 'url(' + URL.createObjectURL(blob) + ')';
      preview.style.display = 'block';
      say('');
      ready();
    }).catch(function () { jpeg = null; say('That file could not be read as a photo.', true); ready(); });
  });
  code.addEventListener('input', ready);

  send.addEventListener('click', function () {
    send.disabled = true;
    say('Sending…');
    fetch('/upload', { method: 'POST', headers: { 'Content-Type': 'image/jpeg', 'X-Code': code.value.trim() }, body: jpeg })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
      .then(function (res) {
        if (res.ok) say('Sent! On the TV, choose it under Home settings › Wallpaper.');
        else say(res.body.error || 'The TV refused the photo.', true);
      })
      .catch(function () { say('Could not reach the TV. Is TV Hub open on the TV?', true); })
      .finally(ready);
  });
})();
</script>
</body>
</html>
