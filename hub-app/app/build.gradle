plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mytvhome.hub'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mytvhome.hub'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: signed with this computer's debug key (back it up).
            signingConfig signingConfigs.debug
        }
    }

    // Keep the big hand-tracking files stored uncompressed so they stream straight from the APK.
    androidResources {
        noCompress 'wasm', 'task'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
